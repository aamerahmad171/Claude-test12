name: Deploy report to GitHub Pages

# Builds docs/index.html from the latest data and publishes it to GitHub Pages.
# Runs after merge to main, or on demand via the "Run workflow" button.
#
# One-time setup: Repo Settings -> Pages -> "Build and deployment" ->
# Source: "GitHub Actions". After that the site lives at
# https://<owner>.github.io/<repo>/
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate report
        run: python scripts/build_report.py
        env:
          # Optional: add a repo secret MARKETCHECK_KEY to publish real listings
          # + VINs. Without it the report falls back to modeled prices.
          MARKETCHECK_KEY: ${{ secrets.MARKETCHECK_KEY }}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
